name: Chez semantic conformance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: make bootstrap
      - run: make test
      - run: make test-kernel
      - run: make test-service
  metatheory-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make bootstrap
      - run: make bootstrap-audit
      - run: make test-metatheory
